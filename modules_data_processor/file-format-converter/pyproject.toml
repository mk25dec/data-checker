[project]
name = "file-format-converter"
version = "0.1.0"
description = "Convert one file to Excel, CSV, JSON lines, or Parquet."
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.2",
    "fastexcel>=0.10",
    "nanoid",
    "polars>=1.20",
    "pyarrow>=15",
    "typer>=0.12",
    "uuid6",
    "xlsxwriter>=3.2",
]

[project.scripts]
file-format-converter = "file_format_converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Monorepo: shared_lib lives at repo root. Match pixi PYTHONPATH when running tests/hatch.
[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
