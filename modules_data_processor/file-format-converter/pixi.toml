[workspace]
name = "file-format-converter"
version = "0.1.0"
description = "DuckDB-backed CLI for converting CSV, JSON, Parquet, and XLSX files."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
duckdb = "==1.5.2"

[pypi-dependencies]
typer = ">=0.12"
nanoid = "*"
uuid6 = "*"
polars = ">=1.20"
fastexcel = ">=0.10"
pyarrow = ">=15"
xlsxwriter = ">=3.2"

[tasks]
# `pixi run convert -- --input-file … --output-file …` — args after `--` go to the CLI.
convert = "python -m file_format_converter.cli convert"
file_format_converter = "python -m file_format_converter.cli convert"
help = "python -m file_format_converter.cli convert --help"
version = "python -m file_format_converter.cli --version"

[activation.env]
# Repo root so `import shared_lib` resolves (sibling of modules_data_processor).
PYTHONPATH = "src:../.."
