[workspace]
name = "join-horizontal"
version = "0.1.0"
description = "DuckDB-backed CLI to join two Parquet tables horizontally (Parquet input only)."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
duckdb = "==1.5.2"

[pypi-dependencies]
typer = ">=0.12"
polars = ">=1.20"
pyarrow = ">=15"
xlsxwriter = ">=3.2"

[tasks]
join_horizontal = "python -m join_horizontal.cli join"
help = "python -m join_horizontal.cli join --help"
version = "python -m join_horizontal.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
