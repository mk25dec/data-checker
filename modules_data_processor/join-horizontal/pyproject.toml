[project]
name = "join-horizontal"
version = "0.1.0"
description = "Merge two tables side by side using shared reference columns."
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.2",
    "polars>=1.20",
    "pyarrow>=15",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.scripts]
join-horizontal = "join_horizontal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
