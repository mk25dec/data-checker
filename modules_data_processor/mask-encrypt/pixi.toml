[workspace]
name = "mask-encrypt"
version = "0.1.0"
description = "Mask, encrypt, or decrypt sensitive columns with CSV-based key store."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"

[pypi-dependencies]
typer = ">=0.12"
click = ">=8"
pandas = ">=2.1"
pyarrow = ">=15"
openpyxl = ">=3.1"
cryptography = ">=42"

[tasks]
mask_encrypt = "python -m mask_encrypt.cli process"
help = "python -m mask_encrypt.cli process --help"
version = "python -m mask_encrypt.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
