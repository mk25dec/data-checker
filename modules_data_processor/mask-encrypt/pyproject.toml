[project]
name = "mask-encrypt"
version = "0.1.0"
description = "Mask, encrypt, or decrypt sensitive columns with CSV-based key store."
requires-python = "==3.12.*"
dependencies = [
    "typer>=0.12",
    "click>=8",
    "pandas>=2.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "cryptography>=42",
]

[project.scripts]
mask-encrypt = "mask_encrypt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
