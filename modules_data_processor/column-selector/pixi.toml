[workspace]
name = "column-selector"
version = "0.1.0"
description = "Select columns from a Parquet table; output Parquet or CSV."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"

[pypi-dependencies]
click = ">=8"
typer = ">=0.12"
pyarrow = ">=15"
polars = ">=1.20"

[tasks]
select = "python -m column_selector.cli select"
column_selector = "python -m column_selector.cli select"
help = "python -m column_selector.cli select --help"
version = "python -m column_selector.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
