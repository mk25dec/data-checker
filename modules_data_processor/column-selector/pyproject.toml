[project]
name = "column-selector"
version = "0.1.0"
description = "Choose columns from one data file and save a smaller copy."
requires-python = "==3.12.*"
dependencies = [
    "click>=8",
    "polars>=1.20",
    "pyarrow>=15",
    "typer>=0.12",
]

[project.scripts]
column-selector = "column_selector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
