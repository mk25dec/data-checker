[workspace]
name = "pdf-img-data-extract"
version = "0.1.0"
description = "Extract text, tables, or OCR PDF output from PDF/image files."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
tesseract = ">=5"
poppler = ">=24"
ghostscript = ">=10"
tk = ">=8.6"

[pypi-dependencies]
typer = ">=0.12"
click = ">=8"
pandas = ">=2.1"
numpy = ">=1.26"
pymupdf = ">=1.24"
camelot-py = ">=0.11"
pillow = ">=10"
pytesseract = ">=0.3"
easyocr = ">=1.7"
ocrmypdf = ">=16"
python-docx = ">=1.1"
xlsxwriter = ">=3.2"

[tasks]
pdf_img_data_extract = "python -m pdf_img_data_extract.cli extract"
help = "python -m pdf_img_data_extract.cli extract --help"
version = "python -m pdf_img_data_extract.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
