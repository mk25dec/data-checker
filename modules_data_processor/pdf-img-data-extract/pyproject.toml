[project]
name = "pdf-img-data-extract"
version = "0.1.0"
description = "Extract text, tables, or OCR PDF output from PDF/image files."
requires-python = "==3.12.*"
dependencies = [
    "typer>=0.12",
    "click>=8",
    "pandas>=2.1",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "camelot-py>=0.11",
    "pillow>=10",
    "pytesseract>=0.3",
    "easyocr>=1.7",
    "ocrmypdf>=16",
    "python-docx>=1.1",
    "xlsxwriter>=3.2",
]

[project.scripts]
pdf-img-data-extract = "pdf_img_data_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
