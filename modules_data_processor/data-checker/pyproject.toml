[project]
name = "data-checker"
version = "0.1.0"
description = "Check a data file for empty cells and duplicate rows."
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.2",
    "pyarrow>=15",
    "click>=8",
    "typer>=0.12",
]

[project.scripts]
data-checker = "data_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
