[workspace]
name = "data-checker"
version = "0.1.0"
description = "Parquet row-quality checker; metrics from shared_lib.parquet_row_audit."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
duckdb = "==1.5.2"

[pypi-dependencies]
click = ">=8"
typer = ">=0.12"
pyarrow = ">=15"

[tasks]
data_checker = "python -m data_checker.cli check"
help = "python -m data_checker.cli check --help"
version = "python -m data_checker.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
