[workspace]
name = "join-vertical"
version = "0.1.0"
description = "Stack Parquet files vertically with DuckDB (Parquet input only)."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
duckdb = "==1.5.2"

[pypi-dependencies]
typer = ">=0.12"
polars = ">=1.0"
pyarrow = ">=16.0"
xlsxwriter = ">=3.2"

[tasks]
join_vertical = "python -m join_vertical.cli stack"
help = "python -m join_vertical.cli stack --help"
version = "python -m join_vertical.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
