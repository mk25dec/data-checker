[project]
name = "join-vertical"
version = "0.1.0"
description = "Combine several matching tables into one long table."
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.scripts]
join-vertical = "join_vertical.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
