[project]
name = "file-cleaner"
version = "0.1.0"
description = "Clean data after conversion; export Excel, CSV, or data copies."
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.2",
    "polars>=1.20",
    "pyarrow>=15",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.scripts]
file-cleaner = "file_cleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "src:../.."
