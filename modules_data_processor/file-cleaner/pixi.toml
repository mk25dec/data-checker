[workspace]
name = "file-cleaner"
version = "0.1.0"
description = "DuckDB-backed CLI for cleaning Parquet files; Polars for XLSX (Parquet input only)."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.13"
duckdb = "==1.5.2"

[pypi-dependencies]
typer = ">=0.12"
polars = ">=1.20"
pyarrow = ">=15"
xlsxwriter = ">=3.2"

[tasks]
file_cleaner = "python -m file_cleaner.cli clean"
help = "python -m file_cleaner.cli clean --help"
version = "python -m file_cleaner.cli --version"

[activation.env]
PYTHONPATH = "src:../.."
